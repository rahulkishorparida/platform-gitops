apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  sources:
    # Metrics Server Helm chart
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.12.1

      helm:
        valueFiles:
          - $values/infrastructure/metrics-server/values.yaml

    # Git repository containing the values.yaml
    - repoURL: https://github.com/rahulkishorparida/platform-infra.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

      # Which node address should I use
      # How should I handle the kubelet certificate?
      # Metrics Server - HTTPS - Kubelet - certificate verification disabled


