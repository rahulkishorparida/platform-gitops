apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  sources:
     # 1. Helm chart
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 77.6.2
      helm:
        valueFiles:
          - $values/infrastructure/monitoring/kube-prometheus-stack/values.yaml
     # 2. Git repository for values
    - repoURL: https://github.com/rahulkishorparida/platform-infra.git
      targetRevision: main
      ref: values

     # 3. Git repository for SealedSecret
    - repoURL: https://github.com/rahulkishorparida/platform-infra.git
      targetRevision: main
      path: infrastructure/monitoring/secrets
      # directory:
      #   recurse: false  

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true