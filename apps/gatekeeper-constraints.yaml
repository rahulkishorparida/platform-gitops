apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gatekeeper-constraints
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: default

  source:
    repoURL: https://github.com/rahulkishorparida/platform-infra.git
    targetRevision: main
    path: infrastructure/security/gatekeeper/policies/constraints
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true